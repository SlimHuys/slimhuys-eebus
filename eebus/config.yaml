name: SlimHuys EEBUS
version: "0.3.5"
slug: slimhuys_eebus
description: Local EEBUS bridge for heat pumps (Vaillant VR940/VR921) to Home Assistant via MQTT
url: https://github.com/SlimHuys/slimhuys-eebus
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
# EEBUS needs mDNS discovery and an inbound TLS port on the LAN.
host_network: true
# Grid data for the device is read from Home Assistant entities.
homeassistant_api: true
services:
  - mqtt:want
options:
  device_ski: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  poll_interval: 300
  stale_after: 720
  power_limit_max_minutes: 240
  grid_power_entity: ""
  grid_energy_consumed_entity: ""
  grid_energy_feed_in_entity: ""
  port: 4713
  discovery_prefix: homeassistant
  topic_prefix: slimhuys_eebus
  debug: false
schema:
  device_ski: str?
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  poll_interval: int(30,3600)
  stale_after: int(60,7200)
  power_limit_max_minutes: int(0,1440)
  grid_power_entity: str?
  grid_energy_consumed_entity: str?
  grid_energy_feed_in_entity: str?
  port: port
  discovery_prefix: str
  topic_prefix: str
  debug: bool
