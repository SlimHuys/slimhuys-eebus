configuration:
  device_ski:
    name: SKI van het apparaat
    description: >-
      SKI van het EEBUS-apparaat (40 hex-tekens). Laat leeg om het enige
      EEBUS-apparaat op het netwerk te gebruiken. De add-on-log toont elk
      gevonden apparaat.
  mqtt_host:
    name: MQTT-host
    description: >-
      Leeg laten om de Mosquitto-add-on te gebruiken. Invullen voor een
      externe broker.
  mqtt_port:
    name: MQTT-poort
  mqtt_username:
    name: MQTT-gebruikersnaam
  mqtt_password:
    name: MQTT-wachtwoord
  poll_interval:
    name: Poll-interval (seconden)
    description: >-
      Het apparaat stuurt wijzigingen zelf door; pollen is een extra vangnet.
  stale_after:
    name: Verouderd na (seconden)
    description: >-
      Een waarde die zo lang niet ververst is, wordt onbeschikbaar in plaats
      van stil een oud getal te tonen. Minimaal twee poll-intervallen.
  power_limit_max_minutes:
    name: Maximale duur vermogensbegrenzing (minuten)
    description: >-
      Een ingeschakelde begrenzing vervalt vanzelf na zoveel minuten, zodat
      een vergeten automatisering de warmtepomp niet blijvend afknijpt.
      0 = nooit.
  grid_power_entity:
    name: Entiteit netvermogen (experimenteel)
    description: >-
      Sensor in Home Assistant met het vermogen op je netaansluiting (W of
      kW, positief = afname, negatief = teruglevering). Wordt aan het
      apparaat aangeboden voor zijn eigen energiebeheer op zonne-overschot.
      Leeg = uit.
  grid_energy_consumed_entity:
    name: Entiteit afgenomen energie
    description: Optioneel totaal van de afgenomen energie (kWh).
  grid_energy_feed_in_entity:
    name: Entiteit teruggeleverde energie
    description: Optioneel totaal van de teruggeleverde energie (kWh).
  port:
    name: EEBUS-poort
    description: TCP-poort voor inkomende EEBUS-verbindingen (SHIP).
  discovery_prefix:
    name: MQTT discovery-prefix
  topic_prefix:
    name: MQTT topic-prefix
  debug:
    name: Debug-logging
